name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: npm install

      - name: Build Web Application (Vite)
        run: npm run build

      - name: Initialize Capacitor Android
        run: npx cap add android || true

      # Bawa icon + splash from assets/ (sources in docs/brand, ADR-005). Runs before sync.
      - name: Generate Bawa icon and splash
        run: >
          npx --yes @capacitor/assets@3.0.5 generate --android
          --iconBackgroundColor '#12352B' --iconBackgroundColorDark '#12352B'
          --splashBackgroundColor '#12352B' --splashBackgroundColorDark '#0B0C0B'

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradle Executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK for Easy Identification
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/bawa-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bawa-android-apk
          path: build-output/bawa-debug.apk
          retention-days: 30
